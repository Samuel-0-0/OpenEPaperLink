<!DOCTYPE HTML>
<html>

<head>
    <meta http-equiv="content-type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />

    <title>设置页面 - Open EPaper Link 接入点</title>
    <link rel="stylesheet" href="main.css" type="text/css" />
    <link rel="icon" type="image/vnd.icon" href="favicon.ico">
    <style>
        .window {
            margin-left: 10px;
        }
        p {
            margin-bottom: 10px;
        }
        .window input {
            width: 120px;
        }
        h1 {
            padding-top: 20px;
        }
        option, select {
            font-family: monospace, 'lucida console', 'Courier New', Courier;
        }
    </style>
</head>

<body>
    <header>
        <div class="logo">Open EPaper Link 接入点</div>
    </header>

    <div class="container">
        <div class="window">
            <h1>WiFi 配置</h1>
            <p>WiFi MAC 地址： <span id="mac">-</span></p>
            <pre>
SSID            <input type="text" id="ssid"> <button id="listssid">查找 SSID</button>
密码            <input type="password" id="pw">
            </pre>
            <p>如需静态 IP，请填写以下字段。否则请留空。<br></p>
            <pre>
静态 IP         <input type="text" id="ip">
子网掩码        <input type="text" id="mask">
网关            <input type="text" id="gw">
DNS             <input type="text" id="dns">
            </pre>
            <button id="connect">保存 WiFi 设置并重启</button><br>

        </div>
    </div>
    <script src="setup.js"></script>

</body>

</html>
